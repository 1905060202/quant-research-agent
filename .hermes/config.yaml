# QRA 配置 · Hermes 底座（deepseek-v4-pro，anthropic 端点）
model:
  # 裸名：provider=anthropic 时 API 只认 deepseek-v4-pro / deepseek-v4-flash，
  # 厂商前缀形式仅对聚合器 provider 有效（agent_init 正规化只剥匹配前缀，
  # "deepseek/" 会漏过去直接 400）。与 run_qra.sh 的 --model 传参一致。
  default: "deepseek-v4-pro"
  provider: "anthropic"

# QRA 插件（.hermes/plugins/qra/ + qra_verify/ + qra_refine/ + qra_python/）
plugins:
  enabled:
    - qra
    - qra_verify
    - qra_refine
    - qra_python

# 记忆：qra_memory provider（Mem0 增量协议 + 契约只读 + Dream 整合）
# 内置 MEMORY.md 仍可用作会话草稿；qra_memory 是持久层
memory:
  provider: qra_memory

# 审批：/yolo off 时 agent 工具线程无审批回调（TLS 只认主线程），
# fail-closed 自动拒绝 + 60s 超时兜底，防挂死
approvals:
  timeout: 60

# 上下文覆盖：/model opus 时 get_model_context_length("opus") 走 models.dev
# 网络探测实测 27.8s（代理不可达时挂死切换），此显式覆盖走官方 step 0b
# 短路（config-read only，永不阻塞网络）。1000000 与 models.dev 对
# claude-opus-5 的 catalog 值一致。
model_overrides:
  anthropic:
    opus:
      context_window: 1000000
